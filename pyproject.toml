[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mathematical-ml-course"
version = "0.1.0"
description = "Practical machine learning for mathematicians"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "matplotlib>=3.8,<4",
  "scikit-learn>=1.5,<2", "xgboost>=2.1,<4", "joblib>=1.4,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3",
  "mlflow>=3,<4", "httpx>=0.27,<1",
  "jupyterlab>=4,<5", "nbformat>=5.10,<6", "nbclient>=0.10,<1",
  "ipykernel>=6,<8", "pytest>=8,<10", "markdown>=3.7,<4", "pygments>=2.18,<3"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
